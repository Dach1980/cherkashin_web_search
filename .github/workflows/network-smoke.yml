name: Network and MCP smoke test

on:
  push:
    branches: [main]
    paths:
      - "scripts/network_mcp_smoke.py"
      - ".github/workflows/network-smoke.yml"
      - "src/**"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  network-mcp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run live HTTPS and MCP stdio smoke test
        run: python scripts/network_mcp_smoke.py
